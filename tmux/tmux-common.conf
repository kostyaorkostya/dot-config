unbind C-b                           # Disable 'Ctrl-b' as default prefix
set -g prefix C-a                    # Use 'Ctrl-a' as prefix
bind-key a send-prefix               # 'Ctrl-a a' sends Ctrl-a
bind-key C-a last-window             # 'Ctrl-a Ctrl-a' will switch between windows (like Alt-Tab in Windows, or Cmd-Tab in Mac OS)
bind-key X confirm kill-window       # 'Ctrl-a X' kills entire window
bind-key K confirm kill-server       # 'Ctrl-a K' kills entire tmux-server
set -g bell-action any               # Bell for each tab, not only for current
set -g set-titles on                 # Changing window title using terminfo

# ### Status line
set-window-option -g window-status-format '#I#F$ #W#[bg=black] '
set-window-option -g window-status-current-format '#[fg=green,bright,bold]#[bg=blue]#I#F#[default]$ #W#[bg=black] #[default]'
unbind ^D
bind ^D detach          # 'Ctrl-a d' - to detatch from tmux-server
unbind ^L
bind ^L refresh-client  # 'Ctrl-a Ctrl-l' - to redraw everything
set -g history-limit 1000000  # scrollback buffer size is 1M lines
set -g default-terminal "tmux-256color" # turn 256 color for all applications
set -s terminal-features[10] 'xterm-256color:RGB' # fixed index so config reloads don't append duplicates
set -s focus-events on

# reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message 'Config reloaded'

# copy mode works as Vim
setw -g mode-keys vi     # explicit: don't rely on the EDITOR-basename heuristic
set -s set-clipboard on  # 'on' (not default 'external') lets nvim's OSC52 yanks through too
bind-key -T copy-mode-vi v send-keys -X begin-selection
# pbcopy on mac (Terminal.app has no OSC52); plain copy elsewhere — OSC52 covers it
if-shell 'command -v pbcopy' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy' \
  'bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel'

# buffer
bind Space choose-buffer

# Faster key repetition
set -s escape-time 10

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# hjkl pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# | and _ are now used for splitting windows into panes
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

set-option -g renumber-windows on

# Originally posted here
# https://github.com/seebi/tmux-colors-solarized
#### COLOUR (Solarized dark)

# default statusbar colors
set-option -g status-style fg=yellow,bg=black #yellow and base02

# default window title colors
set-window-option -g window-status-style fg=brightblue,bg=default #base0 and default
#set-window-option -g window-status-style dim

# active window title colors
set-window-option -g window-status-current-style fg=brightred,bg=default #orange and default
#set-window-option -g window-status-current-style bright

# pane border
set-option -g pane-border-style fg=black #base02
set-option -g pane-active-border-style fg=brightgreen #base01

# message text
set-option -g message-style fg=brightred,bg=black #orange and base01

# pane number display
set-option -g display-panes-active-colour brightred #orange
set-option -g display-panes-colour blue #blue

# clock
set-window-option -g clock-mode-colour green #green

# bell
set-window-option -g window-status-bell-style fg=black,bg=red #base02, red
